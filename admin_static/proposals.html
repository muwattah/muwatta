<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>Segmentation proposals — review only</title>
  <style>
    body { font-family: sans-serif; background:#111; color:#eee; margin:0; }
    header { padding:12px 16px; background:#1c1c1c; }
    main { display:grid; grid-template-columns: 1fr 1fr; gap:12px; padding:12px; }
    pre { white-space:pre-wrap; background:#1a1a1a; padding:8px; max-height:60vh; overflow:auto; }
    .card { border:1px solid #333; padding:8px; margin:8px 0; }
    button { margin:2px; }
    .muted { color:#aaa; font-size:12px; }
  </style>
</head>
<body>
<header>
  <strong>Proposal review</strong> — accept ≠ publish
  <div>
    Vol <input id="vol" type="number" value="1" style="width:4em">
    PDF <input id="page" type="number" value="33" style="width:5em">
    <button onclick="load()">عرض</button>
  </div>
</header>
<main>
  <section>
    <h3>Raw OCR</h3>
    <pre id="raw"></pre>
  </section>
  <section>
    <h3>Proposals</h3>
    <div id="list"></div>
  </section>
</main>
<script>
async function load(){
  const v=document.getElementById('vol').value, p=document.getElementById('page').value;
  const r=await fetch(`/api/proposals?volume=${v}&pdf_page=${p}`);
  const data=await r.json();
  document.getElementById('raw').textContent = (data.ocr && data.ocr.ocr_output_raw) || '(no OCR in this environment)';
  const box=document.getElementById('list');
  box.innerHTML='';
  (data.proposals||[]).forEach(pr => {
    const d=document.createElement('div');
    d.className='card';
    d.innerHTML=`<div><b>${pr.proposed_type}</b> · ${pr.proposal_status} · conf ${pr.confidence}</div>
      <div class="muted">${pr.proposal_id}</div>
      <pre>${pr.raw_excerpt||''}</pre>
      <div class="muted">${pr.reason||''}</div>
      <button onclick="act('accept','${pr.proposal_id}')">accept</button>
      <button onclick="act('reject','${pr.proposal_id}')">reject</button>
      <button onclick="act('unknown','${pr.proposal_id}')">unknown</button>
      <button onclick="act('editorial','${pr.proposal_id}')">editorial</button>
      <button onclick="act('flag','${pr.proposal_id}')">flag</button>`;
    box.appendChild(d);
  });
}
async function act(kind,id){
  await fetch('/api/proposals/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({proposal_id:id,reason:kind})});
  load();
}
</script>
</body>
</html>
